[package]
# Should match .rustfmt.toml
edition = "2024"
name = "sccache"
rust-version = "1.100"
version = "0.18.0"

categories = ["command-line-utilities", "development-tools::build-utils"]
description = "Sccache is a ccache-like tool. It is used as a compiler wrapper and avoids compilation when possible. Sccache has the capability to utilize caching in remote storage environments, including various cloud storage options, or alternatively, in local storage."
keywords = ["ccache"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/mozilla/sccache/"

[package.metadata.binstall]
bin-dir = "sccache-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
pkg-url = "{ repo }/releases/download/v{ version }/sccache-v{ version }-{ target }{ archive-suffix }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "sccache"

[[bin]]
name = "sccache-dist"
required-features = ["dist-server"]

[profile.test]
debug = false # save disk space

[profile.release]
codegen-units = 1
lto = true
strip = true

[dependencies]
anyhow = { version = "1.0", features = ["backtrace"] }
ar = "0.9"
async-trait = "0.1"
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio", "json"] }
backon = { version = "1", default-features = false, features = [
  "std-blocking-sleep",
] }
base64 = "0.23"
bincode = "1"
blake3 = "1"
byteorder = "1.5"
bytes = "1"
clap = { version = "4.5.13", features = ["derive", "env", "wrap_help"] }
directories = "6.0"
encoding_rs = "0.8"
env_logger = "0.11"
fs-err = "3"
futures = "0.3"
hostname = { version = "0.4", optional = true }
http = "1.0"
itertools = "0.15"
jobserver = "0.1"
jwt = { package = "jsonwebtoken", version = "12", optional = true, default-features = false }
jsonwebtoken-btls = { git = "https://github.com/codeandsolder/btls-fast.git", rev = "53c46285a85742dc8c3ab48fbb66613da6b4a297", optional = true }
libc = "0.2.153"
lru = "0.19"
log = "0.4"
lurkmoar = { git = "https://github.com/codeandsolder/lurkmoar-rs", rev = "3cdf30cf748beffd2cec9078a8821d78f4912bef", optional = true }
memchr = "2"
mime = "0.3"
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"], optional = true }
prost = { version = "0.14", optional = true }
object = { version = "0.41", default-features = false, features = ["read", "std"] }
wreq = { workspace = true, optional = true }
rand = "0.10.0"
rayon-core = { version = "1.13", optional = true }
regex = "1.10.3"
percent-encoding = "2.3"
semver = "1.0"
sccache-peer-identity = { path = "crates/peer-identity" }
sccache-cluster-identity = { path = "crates/cluster-identity", optional = true }
sccache-build = { path = "crates/build-runtime", default-features = false }
sccache-dashboard = { path = "crates/scheduler-dashboard", optional = true, features = ["ssr"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = ">=1.0, <1.0.155" # zmij (used in 1.0.147+) requires Rust 1.84+
sha2 = { version = "0.11.0", optional = true }
shlex = "2.0.1"
strip-ansi-escapes = "0.2"
tar = "0.4.40"
tempfile = "3"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "io-util",
  "time",
  "net",
  "process",
  "macros",
] }
tokio-serde = "0.9"
tokio-util = { version = "0.7.18", features = ["codec", "io", "rt"] }
toml = "1.0"
typed-path = "0.13.0"
url = { version = "2", optional = true }
uuid = { version = "1.9", features = ["v4"] }
walkdir = "2"
# by default which pulls in an outdated failure version
which = { version = "8", default-features = false, features = ["real-sys"] }
zstd = "0.14"
zlib-rs-fast = { package = "zlib-rs", version = "=0.6.8", optional = true, default-features = false, features = ["std"] }

# dist-server only
socket2 = { version = "0.6", optional = true }
syslog = { version = "7", optional = true }

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }
assert_cmd = "2.0.13"
cc = "1.0"
chrono = "0.4.42"
divan = { package = "codspeed-divan-compat", version = "6" }
predicates = "=3.1.4"
serial_test = "4.0"
temp-env = "0.3.6"
test-case = "3.3.1"
thirtyfour = "0.38"

# The Linux executables must not require a separate C++ runtime DSO.
# Cargo unifies this feature with all Wreq/TLS users in the same graph.
[target.'cfg(all(target_os = "linux", any(target_env = "gnu", target_env = "musl")))'.dependencies]
wreq = { workspace = true, optional = true, features = ["static-cxx-runtime"] }
lurkmoar = { git = "https://github.com/codeandsolder/lurkmoar-rs", rev = "3cdf30cf748beffd2cec9078a8821d78f4912bef", optional = true, features = ["static-cxx-runtime"] }
jsonwebtoken-btls = { git = "https://github.com/codeandsolder/btls-fast.git", rev = "53c46285a85742dc8c3ab48fbb66613da6b4a297", optional = true, features = ["static-cxx-runtime"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["net", "process"], optional = true }
nix = { version = "0.32.0", optional = true, features = [
  "mount",
  "net",
  "fs",
  "user",
  "sched",
  "signal",
  "process",
] }
daemonix = "0.1"

[target.'cfg(windows)'.dependencies.windows-sys]
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_Security",
]
version = "0.61"

[features]
default = ["dist-client"]
direct-metrics = ["dep:hostname", "dep:lurkmoar"]
native-store = ["sccache-build/async-io", "dep:rayon-core", "tokio-util/io-util"]
http-client = ["dep:wreq", "dep:url", "dep:opentelemetry-proto", "dep:prost"]
# Enable features that require unstable features of Nightly Rust.
unstable = []
# Enables distributed support in the sccache client
dist-client = [
  "dep:nix",
  "dep:sccache-cluster-identity",
  "dep:rustix",
  "native-store",
  "zlib-rs-fast",
  "zlib-rs-fast/parallel",
  "axum",
  "http-client",
  "dep:url",
  "sha2",
]
# Enables the sccache-dist binary
dist-server = [
  "dep:rustix",
  "dep:socket2",
  "dep:sccache-cluster-identity",
  "native-store",
  "url/serde",
  "jwt",
  "dep:jsonwebtoken-btls",
  "zlib-rs-fast",
  "dep:nix",
  "http-client",
  "axum",
  "syslog",
  "dep:hostname",
]
# Opt-in local status UI; worker-only builds do not need the web stack.
scheduler-dashboard = ["dist-server", "dep:sccache-dashboard"]
# Enables dist tests with external requirements
dist-tests = ["dist-client", "dist-server"]

[workspace]
exclude = ["tests/test-crate"]
members = ["crates/build-runtime", "crates/cluster-identity", "crates/peer-identity", "crates/scheduler-dashboard", "tests/integration/randomize_readdir"]

[workspace.dependencies]
btls = { git = "https://github.com/codeandsolder/btls-fast.git", rev = "53c46285a85742dc8c3ab48fbb66613da6b4a297" }
tokio-btls = { git = "https://github.com/codeandsolder/btls-fast.git", rev = "53c46285a85742dc8c3ab48fbb66613da6b4a297" }
wreq = { git = "https://github.com/codeandsolder/wreq-exp.git", rev = "7c0668c3b3e137f233c0aaee132028ab39572dbd", default-features = false, features = ["tokio-rt", "native-roots", "webpki-roots", "stream", "json", "form", "query", "system-proxy", "http2"] }


[lints]
workspace = true

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
cloned_ref_to_slice_refs = "warn"
explicit_into_iter_loop = "warn"
implicit_clone = "warn"
manual_string_new = "warn"
ptr_as_ptr = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_semicolon = "warn"

# One source identity for direct streams and all Flate2 consumers.
[patch.crates-io]
zlib-rs = { git = "https://github.com/codeandsolder/zlib-rs-fast", rev = "98f76b3a242099f2229b048360eeb4707246a68f" }
