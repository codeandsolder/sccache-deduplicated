[package]
name = "cpu-target-profile"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
anyhow = "1"
archspec = "0.2.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
target-lexicon = { version = "=0.13.6", features = ["std"] }
toml = "1"
