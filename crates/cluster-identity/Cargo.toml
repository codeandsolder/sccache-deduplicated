[package]
name = "sccache-cluster-identity"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Persistent machine identities and cluster certificate issuance for sccache"

[dependencies]
sccache-peer-identity = { path = "../peer-identity" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5", features = ["util"] }
btls = { workspace = true }
tokio-btls = { workspace = true }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
bincode = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
wreq = { workspace = true }
url = "2"
http = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync"] }

[lints]
workspace = true
