[package]
name = "sccache-rust-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = ">=1.0, <1.0.155"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
tempfile = "3"
toml = "1"
glob = "0.3"
url = "2"
blake3 = "1"
sha2 = "0.11"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
which = { version = "8", default-features = false, features = ["real-sys"] }
sccache-build = { path = "../build-runtime", default-features = false }


[lints]
workspace = true
