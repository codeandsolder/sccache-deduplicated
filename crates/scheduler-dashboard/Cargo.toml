[package]
name = "sccache-dashboard"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ui = ["dep:leptos", "dep:leptos_meta", "dep:stylance", "dep:chrono"]
ssr = ["ui", "leptos/ssr", "dep:leptos_axum", "dep:any_spawner", "dep:axum", "dep:tokio", "dep:tower-http", "dep:reqwest", "dep:futures", "dep:anyhow", "dep:log"]
hydrate = ["ui", "leptos/hydrate", "dep:wasm-bindgen", "dep:gloo-events", "dep:web-sys", "dep:send_wrapper", "dep:serde_urlencoded"]

[dependencies]
leptos = { version = "0.8", optional = true }
leptos_meta = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
anyhow = { version = "1", optional = true }
any_spawner = { version = "0.3", features = ["tokio"], optional = true }
log = { version = "0.4", optional = true }
axum = { version = "0.8", optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync"], optional = true }
tower-http = { version = "0.7", features = ["fs", "set-header"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"], optional = true }
futures = { version = "0.3", optional = true }
stylance = { version = "0.8", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-events = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["EventSource", "MessageEvent", "Event", "EventTarget"], optional = true }
send_wrapper = { version = "0.6", optional = true }
serde_urlencoded = { version = "0.7", optional = true }

[lints]
workspace = true
