[package]
name = "sccache-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Content-addressed storage and execution environments for build infrastructure"

[dependencies]
anyhow = "1"
bincode = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
log = { version = "0.4", optional = true }
redb = { version = "4.6", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["store"]
store = ["dep:log", "dep:redb", "dep:tempfile"]

[lints]
workspace = true
