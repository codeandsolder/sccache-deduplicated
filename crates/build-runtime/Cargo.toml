[package]
name = "sccache-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Content-addressed storage and execution environments for build infrastructure"

[dependencies]
anyhow = "1"
bincode = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
flate2 = { version = "1", optional = true }
log = { version = "0.4", optional = true }
rand = { version = "0.10", optional = true }
lzma-rust2 = { version = "0.15.8", default-features = false, features = ["std", "xz"], optional = true }
sha2 = { version = "0.11", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
zstd = { version = "0.14", optional = true }
redb = { version = "4.6", optional = true }
tempfile = { version = "3", optional = true }

rustix = { version = "1", features = ["fs", "time", "process"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.16", default-features = false, features = ["abi-7-31"], optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["store"]
mapping = ["dep:rustix", "dep:log"]
store = ["mapping", "dep:rand", "dep:redb", "dep:tempfile", "dep:flate2", "dep:lzma-rust2", "dep:sha2", "dep:tar", "dep:zstd", "dep:fuser", "dep:libc"]

[lints]
workspace = true

[[example]]
name = "zfs_probe"
required-features = ["store"]

[[example]]
name = "package_probe"
required-features = ["store"]
