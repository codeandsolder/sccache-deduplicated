[package]
name = "sccache-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Content-addressed storage and execution environments for build infrastructure"

[dependencies]
sccache-peer-identity = { path = "../peer-identity" }
anyhow = "1"
bincode = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = ">=1.0, <1.0.155"
zstd = { version = "0.14", optional = true }

[target.'cfg(unix)'.dependencies]
compio-buf = { version = "0.8.3", optional = true }
compio-driver = { version = "0.12.5", default-features = false, features = ["io-uring", "polling"], optional = true }
compio-runtime = { version = "0.12.6", optional = true }
tokio = { version = "1", features = ["sync", "rt", "time", "macros"], optional = true }
flate2 = { version = "1", optional = true, default-features = false, features = ["zlib-rs"] }
log = { version = "0.4", optional = true }
rand = { version = "0.10", optional = true }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"], optional = true }
sha2 = { version = "0.11", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
redb = { version = "5.0", optional = true }
tempfile = { version = "3", optional = true }

rustix = { version = "1", features = ["fs", "time", "process", "event"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.19", default-features = false, optional = true }
libc = { version = "0.2", optional = true }
linux-raw-sys = { version = "0.12", optional = true, features = ["general"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
tempfile = "3"

[features]
default = ["store"]
async-io = ["store", "dep:compio-buf", "dep:compio-driver", "dep:compio-runtime"]
mapping = ["dep:tempfile", "dep:log", "dep:libc", "dep:linux-raw-sys"]
store = ["mapping", "dep:tokio", "dep:rand", "dep:redb", "dep:flate2", "dep:lzma-rust2", "dep:sha2", "dep:tar", "dep:zstd", "dep:fuser"]

[lints]
workspace = true

[[example]]
name = "zfs_probe"
required-features = ["store"]

[[example]]
name = "package_probe"
required-features = ["store"]
