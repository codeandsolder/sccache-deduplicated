name: rust-toolchain
description: Select a Rust compiler and expose its toolchain to callers
outputs:
  name:
    description: The Rust toolchain selected for the current job
    value: ${{ steps.install.outputs.name }}
inputs:
  toolchain:
    description: |
      Rust toolchain name.
      See https://rust-lang.github.io/rustup/concepts/toolchains.html#toolchain-specification
    required: false
  target:
    description: Target triple to install for this toolchain
    required: false
  components:
    description: Space-separated list of components to be additionally installed for a new toolchain
    required: false

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: |
        set -euo pipefail
        rustup override set ${{ inputs.toolchain || 'stable' }}
        ${{ inputs.target && format('rustup target add {0}', inputs.target) }}
        ${{ inputs.components && format('rustup component add {0}', inputs.components) }}
        printf 'name=%s\n' '${{ inputs.toolchain || 'stable' }}' >> "$GITHUB_OUTPUT"
        cargo --version
        rustc --version
