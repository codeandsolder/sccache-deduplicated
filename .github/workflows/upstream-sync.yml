name: upstream-sync

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/mozilla/sccache.git 2>/dev/null || \
            git remote set-url upstream https://github.com/mozilla/sccache.git
          git fetch upstream main
          git fetch origin main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch=automation/upstream-sync
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git checkout -B "$branch" origin/main
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Upstream main conflicts with fork main; manual resolution required."
            exit 1
          fi

          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git push --force-with-lease origin HEAD:"$branch"

      - name: Create or update sync PR
        if: steps.prepare.outputs.needed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr list --head "$BRANCH" --base main --state open \
            --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: sync upstream mozilla/sccache" \
              --body "Automated clean merge of \`mozilla/sccache:main\`. The PR is merged only after all fork PR checks pass."
            pr=$(gh pr list --head "$BRANCH" --base main --state open \
              --json number --jq '.[0].number')
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Wait for all sync PR checks
        if: steps.prepare.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for _ in $(seq 1 60); do
            count=$(gh pr checks "$PR" --json name --jq 'length' 2>/dev/null || true)
            count=${count:-0}
            if (( count > 0 )); then
              break
            fi
            sleep 2
          done
          if (( count == 0 )); then
            echo "::error::No PR checks appeared for sync PR #$PR"
            exit 1
          fi
          gh pr checks "$PR" --watch --fail-fast

      - name: Merge tested sync PR
        if: steps.prepare.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR" --merge --delete-branch