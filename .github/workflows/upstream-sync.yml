name: upstream-sync

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/mozilla/sccache.git 2>/dev/null ||             git remote set-url upstream https://github.com/mozilla/sccache.git
          git fetch upstream main
          git fetch origin main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch=automation/upstream-sync
          git checkout -B "$branch" origin/main
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Upstream main conflicts with fork main; manual resolution required."
            exit 1
          fi

          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git push --force-with-lease origin HEAD:"$branch"

      - name: Create or update sync PR
        if: steps.prepare.outputs.needed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr list --head "$BRANCH" --base main --state open             --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            gh pr create               --base main               --head "$BRANCH"               --title "chore: sync upstream mozilla/sccache"               --body "Automated clean merge of `mozilla/sccache:main`. Full fork CI is dispatched explicitly before merge."
            pr=$(gh pr list --head "$BRANCH" --base main --state open               --json number --jq '.[0].number')
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Dispatch full CI on sync branch
        if: steps.prepare.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          before=$(gh run list --workflow ci.yml --branch "$BRANCH"             --event workflow_dispatch --limit 1 --json databaseId             --jq '.[0].databaseId // 0')

          gh workflow run ci.yml --ref "$BRANCH"

          run_id=
          for _ in $(seq 1 60); do
            candidate=$(gh run list --workflow ci.yml --branch "$BRANCH"               --event workflow_dispatch --limit 1 --json databaseId               --jq '.[0].databaseId // 0')
            if [[ "$candidate" != "0" && "$candidate" != "$before" ]]; then
              run_id=$candidate
              break
            fi
            sleep 2
          done

          test -n "$run_id"
          gh run watch "$run_id" --exit-status

      - name: Merge tested sync PR
        if: steps.prepare.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR" --merge --delete-branch
