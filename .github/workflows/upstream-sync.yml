name: upstream-sync

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@ecf97ef6708aaba39d6afad83bb82ebcca84723a # main
    with:
      upstream-repository: mozilla/sccache
      upstream-branch: main
      target-branch: main
      strategy: merge
      rust-toolchain: nightly-2026-11-20
      publish-mode: pull-request
      required-pr-checks: |
        ^host_tools$
        ^strict-rust / Strict Rust
        ^duplicates / New duplicated code$
        ^Linux tests \(runner-local sccache\) / rust$
        ^CI bundle release profile .* / rust$
    secrets:
      upstream-pr-token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
