name: Distributed runtime regression

on:
  # Required status check: never skip a pull request by changed paths.
  pull_request:
  push:
    # Every main SHA must have a distributed-runtime result for fleet promotion.
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Build once; every runtime shard runs the exact same test subject.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_EPHEMERAL_INTERMEDIATES: "false"
  RUSTFLAGS: ""

jobs:
  distributed-build:
    name: Build distributed regression binaries
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve quarantined compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@db22785ec97c653cf0ec96b6964ded8158436f3c # main
        with:
          validation-tier: routine
          rust-toolchain: "nightly-2026-11-23"
      - name: Install pinned compiler
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: clippy
          target: x86_64-pc-windows-gnu
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc g++ clang
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@db22785ec97c653cf0ec96b6964ded8158436f3c # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
          cache-scope: sccache-distributed-regression-binaries
      - name: Compile and package exact distributed test binaries
        run: bash scripts/ci-build-dist-tests.sh "$RUNNER_TEMP/dist-ci.tar"
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@db22785ec97c653cf0ec96b6964ded8158436f3c # main
      - name: Upload compiled tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-regression-binaries
          path: ${{ runner.temp }}/dist-ci.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  distributed-shards:
    name: Distributed runtime (${{ matrix.shard }})
    needs: [distributed-build]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [c, infrastructure, cargo, clippy, dependencies, metadata]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install same pinned compiler for real worker tests
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: "nightly-2026-11-23"
          components: clippy
          target: x86_64-pc-windows-gnu
      - name: Download exact compiled tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-regression-binaries
          path: ${{ runner.temp }}
      - name: Execute distributed runtime shard
        run: bash scripts/ci-dist-test-shard.sh '${{ matrix.shard }}' "$RUNNER_TEMP/dist-ci.tar"

  distributed:
    name: Distributed runtime regression / rust
    runs-on: ubuntu-latest
    needs: [distributed-build, distributed-shards]
    if: ${{ always() }}
    steps:
      - name: Require build and every distributed runtime shard
        run: |
          test '${{ needs.distributed-build.result }}' = success
          test '${{ needs.distributed-shards.result }}' = success
