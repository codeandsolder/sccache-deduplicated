name: Distributed JWT regression

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/dist/**
      - src/bin/sccache-dist/**
      - .github/workflows/dist-jwt-regression.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/dist/**
      - src/bin/sccache-dist/**
      - .github/workflows/dist-jwt-regression.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  jwt-signing:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust nightly-2026-11-20
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "nightly-2026-11-20"
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@079cb96347f3dee5a628baaed46e63055c80efa5 # main
        with:
          rust-toolchain: "nightly-2026-11-20"
      - name: Verify distributed JWT signing
        run: cargo +nightly-2026-11-20 test --locked --no-default-features --features=dist-server --lib test_job_token_verification
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@079cb96347f3dee5a628baaed46e63055c80efa5 # main
