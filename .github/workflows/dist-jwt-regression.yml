name: Distributed runtime regression

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/dist/**
      - crates/build-runtime/**
      - tests/native_dist.rs
      - src/compiler/rust.rs
      - src/compiler/rust_dlltool.rs
      - src/compiler/dynamic_dependencies.rs
      - src/compiler/compiler.rs
      - src/compiler/canonical_paths.rs
      - tests/dist.rs
      - tests/harness/**
      - src/bin/sccache-dist/**
      - .github/workflows/dist-jwt-regression.yml
  push:
    # Every main SHA must have a distributed-runtime result for fleet promotion.
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  distributed:
    name: Distributed runtime regression
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@1c9f5c8968c4caf8754c98ebeb0889d9e774b5ed # main
    with:
      runner: ubuntu-26.04
      rust-toolchain: "nightly-2026-11-22"
      rust-components: clippy
      rust-targets: x86_64-pc-windows-gnu
      isolate-public-sccache-server: true
      rustflags: ""
      timeout-minutes: 30
      command: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends bubblewrap binutils-mingw-w64-x86-64 gcc g++ clang
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        bwrap --ro-bind / / -- /usr/bin/true
        test_runner="$RUNNER_TEMP/dist-test-runner"
        printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'unset SCCACHE_SERVER_UDS SCCACHE_SERVER_PORT' 'exec "$@"' > "$test_runner"
        chmod +x "$test_runner"
        export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$test_runner"
        # Keep compilation and test cache daemons independent. Cold namespace
        # and C cases retain their own workers; the compatible Rust scenarios
        # use one worker with fresh result caches for each case.
        cargo test --locked --target x86_64-unknown-linux-gnu --no-default-features --features=dist-tests --lib test_job_token_verification
        cargo test --locked --target x86_64-unknown-linux-gnu --no-default-features --features=dist-tests --test dist -- --test-threads 1 test_dist_namespace_broker test_dist_rust_ test_dist_c_
