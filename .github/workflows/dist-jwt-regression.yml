name: Distributed JWT regression

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/dist/**
      - src/bin/sccache-dist/**
      - .github/workflows/dist-jwt-regression.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/dist/**
      - src/bin/sccache-dist/**
      - .github/workflows/dist-jwt-regression.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  jwt-signing:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@be66a1ada16209be5b75d39724ef7383892d92cc # main
        with:
          rust-toolchain: "1.99.1"
      - name: Verify distributed JWT signing
        run: cargo +1.99.1 test --locked --no-default-features --features=dist-server --lib test_job_token_verification
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@be66a1ada16209be5b75d39724ef7383892d92cc # main
