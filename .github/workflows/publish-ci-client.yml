name: Publish CI sccache bundle

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit/ref to publish
        required: true
        default: main
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ci-sccache-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  required-gates:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gates.outputs.ready }}
      sha: ${{ steps.gates.outputs.sha }}
    steps:
      - name: Check required workflow gates
        id: gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # Only explicitly requested releases of the current, CI-verified
          # main revision may become the new fleet version.
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_REF" --jq '.sha')"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$sha" != "$latest" ]]; then
            echo "Ref $RELEASE_REF resolves to $sha, not current main $latest" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          ready=true
          for workflow in ci.yml rust-skills2-strict.yml clone-regression.yml dist-jwt-regression.yml; do
            conclusion="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$sha&event=push&per_page=20" |
                jq -r --arg sha "$sha" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | .conclusion // ""'
            )"
            echo "$workflow: ${conclusion:-not completed}"
            if [[ "$conclusion" != "success" ]]; then
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" != true ]]; then
            echo "::error::The exact current main revision has not passed every fleet release gate."
            exit 1
          fi

  build-publish:
    needs: required-gates
    if: needs.required-gates.outputs.ready == 'true'
    # 24.04 ships GLIBC 2.39; the oldest managed host must stay compatible.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.required-gates.outputs.sha }}

      - name: Resolve source revision
        id: rev
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source SHA: $sha"

      - name: Read release protocol and rollout epoch
        id: protocol
        shell: bash
        run: |
          set -euo pipefail
          # Read from the checked-out source revision, never from the
          # current workflow revision for a separately pinned release.
          source contrib/codeandsolder/release-protocol.env
          [[ "$dist_protocol" =~ ^[1-9][0-9]*$ ]]
          [[ "$rollout_epoch" =~ ^[1-9][0-9]*$ ]]
          [[ "$glibc_abi_max" =~ ^[0-9]+\.[0-9]+$ ]]
          echo "dist_protocol=$dist_protocol" >> "$GITHUB_OUTPUT"
          echo "rollout_epoch=$rollout_epoch" >> "$GITHUB_OUTPUT"
          echo "glibc_abi_max=$glibc_abi_max" >> "$GITHUB_OUTPUT"
          [[ "$rust_toolchain" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "rust_toolchain=$rust_toolchain" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install ${{ steps.protocol.outputs.rust_toolchain }} --profile minimal
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@db22785ec97c653cf0ec96b6964ded8158436f3c # main
        with:
          rust-toolchain: "${{ steps.protocol.outputs.rust_toolchain }}"

      - name: Build CI client + dist worker
        shell: bash
        run: |
          set -euo pipefail
          release_cargo=(env -u RUSTC -u RUSTDOC cargo +${{ steps.protocol.outputs.rust_toolchain }})
          target_dir="$("${release_cargo[@]}" metadata --locked --no-deps --format-version 1 | jq -r .target_directory)"
          "${release_cargo[@]}" build --release --locked \
            --no-default-features \
            --features s3,gha,dist-client,dist-server,direct-metrics \
            --bin sccache --bin sccache-dist

          install -D -m 0755 "$target_dir/release/sccache" dist/sccache-linux-x86_64-v2
          install -D -m 0755 "$target_dir/release/sccache-dist" dist/sccache-dist-linux-x86_64-v2
          for binary in dist/sccache-linux-x86_64-v2 dist/sccache-dist-linux-x86_64-v2; do
            version="$("$binary" --version)"
            printf '%s\n' "$version"
            [[ "$version" == *"(${{ steps.rev.outputs.sha }})" ]]
          done
          sha256sum dist/sccache-linux-x86_64-v2 dist/sccache-dist-linux-x86_64-v2 > dist/SHA256SUMS
          {
            echo "source_sha=${{ steps.rev.outputs.sha }}"
            echo "rust_toolchain=${{ steps.protocol.outputs.rust_toolchain }}"
            echo "rustflags=-C target-cpu=x86-64-v2"
            echo "features=s3,gha,dist-client,dist-server,direct-metrics"
            echo "dist_protocol=${{ steps.protocol.outputs.dist_protocol }}"
            echo "rollout_epoch=${{ steps.protocol.outputs.rollout_epoch }}"
            echo "glibc_abi_max=${{ steps.protocol.outputs.glibc_abi_max }}"
            echo "tls_backend=boringssl-static"
            echo "capabilities=$(dist/sccache-linux-x86_64-v2 --capabilities | paste -sd, -)"
          } > dist/build.txt

      - name: Build matching dashboard scheduler and browser package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version
          readelf --version
          rustup target add --toolchain "${{ steps.protocol.outputs.rust_toolchain }}" wasm32-unknown-unknown
          release_cargo=(env -u RUSTC -u RUSTDOC cargo +${{ steps.protocol.outputs.rust_toolchain }})
          target_dir="$("${release_cargo[@]}" metadata --locked --no-deps --format-version 1 | jq -r .target_directory)"
          scripts/install-scheduler-dashboard-tools.sh "$target_dir/dashboard-tools"
          env -u RUSTFLAGS scripts/build-scheduler-dashboard.sh "$target_dir/dashboard-tools/wasm-bindgen" "$target_dir/dashboard-tools/stylance"
          "${release_cargo[@]}" build --release --locked \
            --no-default-features \
            --features s3,gha,dist-client,dist-server,direct-metrics,scheduler-dashboard \
            --bin sccache-dist
          install -D -m 0755 "$target_dir/release/sccache-dist" dist/sccache-scheduler-dashboard-linux-x86_64-v2
          scripts/package-scheduler-dashboard.sh \
            dist/sccache-scheduler-dashboard-linux-x86_64-v2 "$target_dir/scheduler-dashboard/pkg" \
            dist/sccache-scheduler-dashboard-linux-x86_64-v2.tar.gz

      - name: Reject unsupported fleet native shared library ABIs
        shell: bash
        run: >-
          bash contrib/codeandsolder/verify-release-native-abi.sh
          dist/sccache-linux-x86_64-v2 dist/sccache-dist-linux-x86_64-v2 dist/sccache-scheduler-dashboard-linux-x86_64-v2

      - name: Finalize mandatory sccache before publishing binaries
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@db22785ec97c653cf0ec96b6964ded8158436f3c # main

      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: sccache-ci-${{ needs.required-gates.outputs.sha }}
        run: |
          set -euo pipefail
          # A newer main revision must not be overwritten by an older build.
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$latest" != "${{ steps.rev.outputs.sha }}" ]]; then
            echo "Skipping superseded main release (latest: $latest)"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; immutable release is already published."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ steps.rev.outputs.sha }}" \
            --title "CI sccache bundle ${{ steps.rev.outputs.sha }}" \
            --notes "Pinned Linux x86-64-v2 sccache client + direct sccache-dist worker bundle for centrally managed CI." \
            dist/sccache-linux-x86_64-v2 dist/sccache-dist-linux-x86_64-v2 dist/SHA256SUMS dist/build.txt \
            dist/sccache-scheduler-dashboard-linux-x86_64-v2.tar.gz dist/sccache-scheduler-dashboard-linux-x86_64-v2.tar.gz.sha256
