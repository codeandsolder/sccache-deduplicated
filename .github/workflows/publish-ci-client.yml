name: Publish CI sccache bundle

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit/ref to publish
        required: true
        default: main
        type: string
      release_tag:
        description: Immutable release tag
        required: true
        type: string
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-ci-sccache-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  build-publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}

      - name: Resolve source revision
        id: rev
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source SHA: $sha"

      - name: Install Rust 1.99.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal

      - name: Build CI client + dist worker
        shell: bash
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"
        run: |
          set -euo pipefail
          cargo +1.99.0 build --release --locked \
            --no-default-features \
            --features s3,dist-client,dist-server \
            --bin sccache --bin sccache-dist

          install -D -m 0755 target/release/sccache dist/sccache-linux-x86_64-v2
          install -D -m 0755 target/release/sccache-dist dist/sccache-dist-linux-x86_64-v2
          sha256sum dist/sccache-linux-x86_64-v2 dist/sccache-dist-linux-x86_64-v2 > dist/SHA256SUMS
          {
            echo "source_sha=${{ steps.rev.outputs.sha }}"
            echo "rust_toolchain=1.99.0"
            echo "rustflags=-C target-cpu=x86-64-v2"
            echo "features=s3,dist-client,dist-server"
          } > dist/build.txt

      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || format('sccache-ci-{0}', github.event.workflow_run.head_sha) }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; immutable release is already published."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ steps.rev.outputs.sha }}" \
            --title "CI sccache bundle ${{ steps.rev.outputs.sha }}" \
            --notes "Pinned Linux x86-64-v2 sccache client + direct sccache-dist worker bundle for centrally managed CI." \
            dist/sccache-linux-x86_64-v2 dist/sccache-dist-linux-x86_64-v2 dist/SHA256SUMS dist/build.txt
