name: Repair canonical Cargo env hashing

on:
  push:
    branches: [fix/jsonwebtoken-crypto-provider]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/jsonwebtoken-crypto-provider

      - name: Apply canonical Cargo env patch
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/canonical-cargo-env.patch <<'PATCH'
          diff --git a/src/compiler/rust.rs b/src/compiler/rust.rs
          index fd58455..3487033 100644
          --- a/src/compiler/rust.rs
          +++ b/src/compiler/rust.rs
          @@ -639,6 +639,7 @@ struct RustShadowRecord {
               target_json_inputs: Vec<RustShadowInput>,
               dep_env: Vec<RustShadowEnv>,
               cargo_env: Vec<RustShadowEnv>,
          +    cargo_env_hashed: Vec<RustShadowEnv>,
               outputs: Vec<RustShadowOutput>,
           }
           
          @@ -675,6 +676,48 @@ fn rust_cache_hashes_cargo_env(name: &std::ffi::OsStr) -> bool {
                   && name != "CARGO_ENCODED_RUSTFLAGS"
           }
           
          +fn rust_cargo_env_for_hash(
          +    env: &[(OsString, OsString)],
          +    canonical: Option<&CanonicalRustPaths>,
          +) -> Vec<(OsString, OsString)> {
          +    let mut hashed = env
          +        .iter()
          +        .filter(|(name, _)| rust_cache_hashes_cargo_env(name))
          +        .filter(|(name, _)| {
          +            canonical.is_none() || !matches!(name.to_str(), Some("CARGO_HOME" | "CARGO_TARGET_DIR"))
          +        })
          +        .map(|(name, value)| {
          +            let value = canonical.map_or_else(
          +                || value.clone(),
          +                |canonical| canonical.env_value_to_canonical(name, value),
          +            );
          +            (name.clone(), value)
          +        })
          +        .collect::<Vec<_>>();
          +
          +    if let Some(canonical) = canonical {
          +        if let Some(cargo_home) = canonical.cargo_home.as_ref() {
          +            hashed.push((
          +                OsString::from("CARGO_HOME"),
          +                canonical.env_value_to_canonical(
          +                    std::ffi::OsStr::new("CARGO_HOME"),
          +                    cargo_home.as_os_str(),
          +                ),
          +            ));
          +        }
          +        hashed.push((
          +            OsString::from("CARGO_TARGET_DIR"),
          +            canonical.env_value_to_canonical(
          +                std::ffi::OsStr::new("CARGO_TARGET_DIR"),
          +                canonical.target_root.as_os_str(),
          +            ),
          +        ));
          +    }
          +
          +    hashed.sort();
          +    hashed
          +}
          +
           fn rust_shadow_plain_env(name: &std::ffi::OsStr) -> bool {
               matches!(
                   name.to_str(),
          @@ -2308,23 +2351,14 @@ where
                       .cloned()
                       .collect();
                   env_vars.sort();
          -        for (var, val) in &env_vars {
          -            // CARGO_MAKEFLAGS will have jobserver info which is extremely non-cacheable.
          -            // CARGO_REGISTRIES_*_TOKEN contains non-cacheable secrets.
          -            // Registry override config doesn't need to be hashed, because deps' package IDs
          -            // already uniquely identify the relevant registries.
          -            // CARGO_BUILD_JOBS only affects Cargo's parallelism, not rustc output.
          -            // CARGO_ENCODED_RUSTFLAGS is already cached in argument list.
          -            if !rust_cache_hashes_cargo_env(var) {
          -                continue;
          -            }
          -
          +        // In canonical mode, hash Cargo's semantic defaults rather than whether
          +        // CARGO_HOME/CARGO_TARGET_DIR happened to be explicitly exported by the
          +        // invoking Cargo wrapper. Their physical roots are already represented by
          +        // CanonicalRustPaths, and direct env!/option_env! observations remain in
          +        // env_deps above and are therefore still hashed exactly as observed.
          +        for (var, val) in rust_cargo_env_for_hash(&env_vars, canonical_paths.as_ref()) {
                       var.hash(&mut HashToDigest { digest: &mut m });
                       m.update(b"=");
          -            let val = canonical_paths.as_ref().map_or_else(
          -                || val.clone(),
          -                |canonical| canonical.env_value_to_canonical(var, val),
          -            );
                       val.hash(&mut HashToDigest { digest: &mut m });
                   }
                   // 9. The cwd of the compile. This will wind up in the rlib.
          @@ -2489,6 +2523,15 @@ where
                       })
                       .collect::<Vec<_>>();
           
          +            let cargo_env_hashed = rust_cargo_env_for_hash(&env_vars, canonical)
          +                .into_iter()
          +                .map(|(name, value)| RustShadowEnv {
          +                    name: name.to_string_lossy().into_owned(),
          +                    // This is the effective value fed into the cache digest.
          +                    value: rust_shadow_env_value(&name, &value, None),
          +                })
          +                .collect::<Vec<_>>();
          +
                       let mut shadow_outputs = outputs
                           .iter()
                           .map(|(cache_object_key, output)| RustShadowOutput {
          @@ -2522,7 +2565,7 @@ where
                           schema: 1,
                           timestamp_unix_ms,
                           normalization_policy: if canonical.is_some() {
          -                    "canonical-rust-layout-v2".to_owned()
          +                    "canonical-rust-layout-v3".to_owned()
                           } else {
                               "legacy-rust-v6".to_owned()
                           },
          @@ -2564,6 +2607,7 @@ where
                           target_json_inputs: shadow_target_json_inputs,
                           dep_env,
                           cargo_env,
          +                    cargo_env_hashed,
                           outputs: shadow_outputs,
                       };
                       append_rust_shadow_record(shadow_log_path, &record);
          @@ -5033,6 +5077,10 @@ proc_macro false
                           OsString::from("CARGO_TARGET_DIR"),
                           a.tempdir.path().join("target").into_os_string(),
                       ),
          +            (
          +                OsString::from("CARGO_HOME"),
          +                PathBuf::from("/tmp/sccache-canonical-explicit-home/.cargo").into_os_string(),
          +            ),
                       (
                           OsString::from("CARGO_MANIFEST_DIR"),
                           a.tempdir.path().as_os_str().to_owned(),
          @@ -5044,8 +5092,8 @@ proc_macro false
                           OsString::from("1"),
                       ),
                       (
          -                OsString::from("CARGO_TARGET_DIR"),
          -                b.tempdir.path().join("target").into_os_string(),
          +                OsString::from("HOME"),
          +                PathBuf::from("/tmp/sccache-canonical-implicit-home").into_os_string(),
                       ),
                       (
                           OsString::from("CARGO_MANIFEST_DIR"),
          PATCH
          if git apply --reverse --check /tmp/canonical-cargo-env.patch >/dev/null 2>&1; then
            echo 'canonical Cargo env patch already applied'
          else
            git apply --check /tmp/canonical-cargo-env.patch
            git apply /tmp/canonical-cargo-env.patch
          fi

      - name: Install release Rust
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Verify canonical cross-root hashing
        run: cargo +1.98.1 test --locked --no-default-features --features=s3,dist-client,dist-server --lib test_canonical_hash_equal_across_physical_roots

      - name: Commit cache-key fix
        shell: bash
        run: |
          set -euo pipefail
          git add src/compiler/rust.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'cache-key fix already present'
            exit 0
          fi
          git config user.name codeandsolder
          git config user.email codeandsolder@gmail.com
          git commit -m 'fix(rust): normalize implicit Cargo cache roots'
          git push origin HEAD:fix/jsonwebtoken-crypto-provider
