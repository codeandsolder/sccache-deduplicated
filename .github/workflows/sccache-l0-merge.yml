name: Merge shared sccache L0

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write

cache-mode: write

jobs:
  merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    uses: codeandsolder/ci-workflows/.github/workflows/merge-sccache-l0.yml@main
    with:
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '0' }}
      source-event: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || 'workflow_dispatch' }}
      bootstrap-only: ${{ github.event_name == 'workflow_dispatch' }}

  garage-upload:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@main
    with:
      garage-upload-only: true
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '0' }}
