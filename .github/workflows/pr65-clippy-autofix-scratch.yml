name: PR65 Clippy Autofix Scratch

on:
  push:
    branches: [ci/rust-skills2-strict]

permissions:
  contents: write

concurrency:
  group: pr65-clippy-autofix
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Apply machine-applicable Clippy fixes across the workspace
        shell: bash
        run: |
          cargo +nightly clippy --fix --allow-dirty --allow-staged --locked --workspace --all-targets -- \
            -Wwarnings \
            -Wunfulfilled_lint_expectations \
            -Wunexpected_cfgs \
            -Wunsafe_op_in_unsafe_fn \
            -Wclippy::correctness \
            -Wclippy::suspicious \
            -Wclippy::perf \
            -Wclippy::style \
            -Wclippy::complexity \
            -Wclippy::pedantic \
            -Wclippy::nursery \
            -Wclippy::unwrap_used \
            -Wclippy::expect_used \
            -Wclippy::panic \
            -Wclippy::todo \
            -Wclippy::unimplemented \
            -Wclippy::dbg_macro \
            -Wclippy::undocumented_unsafe_blocks \
            -Wclippy::missing_safety_doc \
            -Wclippy::await_holding_lock \
            -Wclippy::allow_attributes \
            -Wclippy::allow_attributes_without_reason

      - name: Format and commit fixes
        shell: bash
        run: |
          cargo +nightly fmt --all
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo "No machine-applicable fixes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply workspace-wide nightly clippy autofixes"
          git push
