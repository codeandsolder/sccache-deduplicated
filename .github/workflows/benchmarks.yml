name: Benchmarks

# spell-checker:ignore codspeed dtolnay Swatinem

on:
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

# End the current execution if there is a new changeset in the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  benchmarks:
    if: github.repository == 'mozilla/sccache'
    name: Run ${{ matrix.mode }} benchmarks (CodSpeed)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode:
          - simulation
          - memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-codspeed
        shell: bash
        run: cargo install cargo-codspeed --locked

      - name: Build benchmarks
        shell: bash
        run: cargo codspeed build

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5
        env:
          CODSPEED_LOG: debug
        with:
          mode: ${{ matrix.mode }}
          run: cargo codspeed run > /dev/null
          token: ${{ secrets.CODSPEED_TOKEN }}
