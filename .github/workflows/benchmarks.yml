name: Benchmarks

# spell-checker:ignore codspeed dtolnay Swatinem

on:
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

# End the current execution if there is a new changeset in the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  benchmarks:
    if: github.repository == 'mozilla/sccache'
    name: Run ${{ matrix.mode }} benchmarks (CodSpeed)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode:
          - simulation
          - memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        id: rust
        with:
          toolchain: "nightly-2026-11-26"

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@1a1b52a97b8eef53c7883b7af94dd3a2480b314a # main
        with:
          rust-toolchain: ${{ steps.rust.outputs.name }}

      - name: Install cargo-codspeed
        shell: bash
        run: cargo +${{ steps.rust.outputs.name }} install cargo-codspeed --locked

      - name: Build benchmarks
        shell: bash
        run: cargo +${{ steps.rust.outputs.name }} codspeed build

      - name: Run benchmarks
        uses: CodSpeedHQ/action@b1f28b5eccf7cb5bfe6a2a89cb3053eb67f1150c # v5
        env:
          CODSPEED_LOG: debug
        with:
          mode: ${{ matrix.mode }}
          run: cargo +${{ steps.rust.outputs.name }} codspeed run > /dev/null
          token: ${{ secrets.CODSPEED_TOKEN }}

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@1a1b52a97b8eef53c7883b7af94dd3a2480b314a # main
