name: Strict Rust

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@9c14ef2d72423958c56944febc620ec50f01d65a # main
    with:
      rustflags: ""
      rust-targets: wasm32-unknown-unknown
      python-ci-paths: tools
      strict-suites: |
        [
          {"name":"workspace","allow-test-panics":true},
          {"name":"cpu-target-profile","directory":"tools/cpu-target-profile"},
          {"name":"dashboard-ssr","cargo":["--locked","-p","sccache","-p","sccache-dashboard","--no-default-features","--features","sccache/dist-client,sccache/dist-server,sccache/direct-metrics,sccache/scheduler-dashboard,sccache-dashboard/ssr","--lib","--bins","--examples"],"allow-test-panics":true},
          {"name":"dashboard-wasm","cargo":["--locked","-p","sccache-dashboard","--no-default-features","--features","hydrate","--target","wasm32-unknown-unknown","--lib"]}
        ]
