name: Strict Rust

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@f2b37a67bfe379e8db96731f97ad3c345065b168 # main
    with:
      command: ":"
      rustflags: ""
      python-ci-paths: tools
      strict-suites: |
        [
          {"name":"workspace","allow-test-panics":true},
          {"name":"cpu-target-profile","directory":"tools/cpu-target-profile"}
        ]
