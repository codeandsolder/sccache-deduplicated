name: Strict Rust

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      python-ci-paths: tools
      allow-test-panics: true

  strict-cpu-target-profile:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      working-directory: tools/cpu-target-profile
      python-ci-paths: tools

  strict-dashboard-ssr:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      cargo-args: "--locked -p sccache -p sccache-dashboard --no-default-features --features sccache/scheduler-dashboard,sccache-dashboard/ssr --lib --bins"
      python-ci-paths: tools
      allow-test-panics: true

  strict-dashboard-wasm:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      cargo-args: "--locked -p sccache-dashboard --no-default-features --features hydrate --target wasm32-unknown-unknown --lib"
      rust-targets: wasm32-unknown-unknown
      python-ci-paths: tools
